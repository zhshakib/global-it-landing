
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Discover tailored IT services, cloud solutions, and technology support for your business."
  >

  <title>Global IT | Technology Solutions</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Apply saved theme before the page renders -->
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.setAttribute(
        "data-bs-theme",
        savedTheme || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          Global<span class="brand-accent">IT</span>
        </a>

        <div class="d-flex align-items-center gap-3 ms-auto">
          <button
            class="btn btn-outline-secondary btn-sm"
            id="theme-toggle"
            type="button"
            aria-label="Switch color theme"
          >
            <span id="theme-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <section class="py-5 text-center">
      <p class="text-body-secondary mb-2">
        GLOBAL IT · TECHNOLOGY SOLUTIONS
      </p>

      <h1 class="display-5 fw-bold">
        Your next chapter starts here.
      </h1>

      <p class="lead text-body-secondary">
        We're building a better way to connect businesses with technology.
      </p>
    </section>
  </main>

  <footer class="border-top py-4">
    <div class="container text-center">
      <p class="mb-0 text-body-secondary small">
        © <span id="current-year"></span> Global IT.
        Website concept for demonstration purposes.
      </p>
    </div>
  </footer>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Custom JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
